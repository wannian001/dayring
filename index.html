<!doctype html>
<html lang="en" data-static="true" data-build="8ad8a09b08">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Health AIO</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <!-- the design kit (tokens, components), then Health AIO's own page rules -->
  <link rel="stylesheet" href="css/tokens.css?v=8ad8a09b08">
  <link rel="stylesheet" href="css/kit.css?v=8ad8a09b08">
  <link rel="stylesheet" href="css/app.css?v=8ad8a09b08">
  <script>
    // apply a saved light/dark choice and a folded sidebar before first paint so the page does not flash
    try {
      var m = new URLSearchParams(location.search).get("mode") || localStorage.getItem("healthaio.mode");
      if (m === "light" || m === "dark") document.documentElement.dataset.mode = m;
      if (localStorage.getItem("healthaio.side") === "folded") document.documentElement.classList.add("side-folded");
    } catch (e) {}
  </script>
  <script>
    // if a script of the app could not be loaded (a dropped connection), say so instead of "Loading…" forever
    function healthaioFailed() {
      if (window.healthaioStarted || !document.querySelector("main")) return;
      var zh = false;
      try { zh = (new URLSearchParams(location.search).get("lang") || localStorage.getItem("healthaio.lang") || navigator.language || "").slice(0, 2) === "zh"; } catch (e) {}
      document.querySelector("main").innerHTML = '<div class="card"><p class="lede">' + (zh ? "这一页没加载完" : "The page did not finish loading") +
        '</p><p><button class="tool" type="button" onclick="location.reload()">' + (zh ? "重新加载" : "Reload") + "</button></p></div>";
    }
    setTimeout(healthaioFailed, 10000);
  </script>
  <script type="module" src="js/app.js?v=8ad8a09b08" onerror="healthaioFailed()"></script>
</head>
<body>
  <header class="side"></header>
  <main aria-live="polite"><p class="muted">Loading…</p></main>
</body>
</html>
