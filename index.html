<!doctype html>
<html lang="en" data-static="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>dayring</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // apply a saved light/dark choice before first paint so the page does not flash
    try {
      var m = new URLSearchParams(location.search).get("mode") || localStorage.getItem("dayring.mode");
      if (m === "light" || m === "dark") document.documentElement.dataset.mode = m;
    } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="top"><div class="top-in"></div></header>
  <main aria-live="polite"><p class="muted">Loading…</p></main>
</body>
</html>
