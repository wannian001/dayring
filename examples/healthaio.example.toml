# Copy this file to ./healthaio.toml and edit. Every section is optional:
# a page without its plan still shows the facts, just without a goal to compare with.

[healthaio]
data_dir = "data"                 # where the CSV files live (relative to this file)
timezone = "Australia/Melbourne"  # IANA name; all times in the CSV files are local to it
locale = "en"                     # en or zh; the page has a switch too
title = "Health AIO"

# What `healthaio collect` (the Mac app, every 2 hours) imports by itself. "ai-logs" adds Claude Code and Codex
# (times and counts only). Default: Screen Time only.
# [collect]
# sources = ["macos-screentime", "ai-logs"]

# Once a day the app asks GitHub whether there is a newer version (its only request to the internet).
# [updates]
# check = false

[devices]
# When two devices are in use at the same minute, the first one in this list counts.
priority = ["phone", "tablet", "laptop", "desktop"]
# For "devices at once" (the Time page): a computer keeps its screen on while you are away, so an AI agent
# app in front on one of these while another device is in use counts as the agent working, not as you.
computers = ["laptop", "desktop"]
agent_apps = ["Claude", "ChatGPT", "Codex", "Cursor", "Windsurf", "Terminal", "iTerm2", "Warp", "Ghostty"]

[plan.sleep]
target_hours = 8
bedtime = "23:30"
wake = "07:30"

# Optional: pull a late wake time earlier, one step after each on-time morning.
# [plan.wake_shift]
# start = "2026-10-01"
# first_alarm = "10:30"
# final_alarm = "07:30"
# step_min = 15
# grace_min = 15

# Optional: a weight plan. The Body page draws the corridor between the two weekly rates.
# [plan.weight]
# start_date = "2026-09-01"
# start_kg = 80
# target_kg = 74
# weekly_loss_pct = [0.5, 1.0]

[plan.training]
mon = "Strength · upper body"
wed = "Easy run 30 min"
fri = "Strength · lower body"

# Optional: a week of exercise. Without it the Exercise page uses the WHO guideline for adults
# (150 minutes of moderate activity a week, muscle-strengthening on 2 days) and says so.
[plan.exercise]
weekly_min = 150
strength_days = 2

# Optional: food. protein_g_per_kg uses your latest weight; or set protein_g for a fixed amount.
# last_meal_gap_h: how many hours before falling asleep the last meal should be over.
[plan.food]
kcal_min = 1900
kcal_max = 2300
protein_g_per_kg = 1.6
last_meal_gap_h = 3

[plan.screen]
entertainment_max_hours = 3
work_min_hours = 4
