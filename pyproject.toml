[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "proactive-health-aio"
dynamic = ["version"]
description = "Proactive health management, all in one, on your own computer: sleep, exercise, food, weight, screens and plans, each compared with your own normal, with what to adjust today."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jiakuo Tang" }]
keywords = ["proactive health", "personal informatics", "quantified self", "dashboard", "local-first", "apple health", "nutrition", "exercise", "screen time"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = []

[project.optional-dependencies]
toml = ["tomli>=1.1; python_version < '3.11'"]

[project.scripts]
healthaio = "healthaio.__main__:main"

[project.urls]
Demo = "https://wannian001.github.io/proactive-health-aio/"
Source = "https://github.com/wannian001/proactive-health-aio"

[tool.setuptools.dynamic]
version = { attr = "healthaio.__version__" }

[tool.setuptools.packages.find]
include = ["healthaio*"]

[tool.setuptools.package-data]
healthaio = ["web/*", "web/**/*", "importers/*.json"]
